<!doctype html>
<html lang="es">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Embarque · Tarjetas de embarque</title>

  <meta name="theme-color" content="#efece4">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preload" href="fonts/archivo-latin-wdth.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { var t = localStorage.getItem('embarque-tema'); if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>

  <div class="app">
    <header class="appbar">
      <a class="brand" href="#/" aria-label="Embarque, inicio">
        <span class="brand__mark"><svg class="ic" aria-hidden="true"><use href="#i-plane"/></svg></span>
        <span class="brand__name">Embarque</span>
      </a>
      <nav class="nav" aria-label="Principal">
        <a class="nav__item" data-nav="inicio" href="#/"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Inicio</span></a>
        <a class="nav__item" data-nav="tarjetas" href="#/tarjetas"><svg class="ic" aria-hidden="true"><use href="#i-ticket"/></svg><span>Tarjetas</span></a>
        <a class="nav__item nav__item--add" data-nav="nueva" href="#/nueva"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>Añadir</span></a>
        <a class="nav__item" data-nav="ajustes" href="#/ajustes"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg><span>Ajustes</span></a>
      </nav>
      <button type="button" class="install-btn" data-install>
        <svg class="ic" aria-hidden="true"><use href="#i-install"/></svg><span>Instalar app</span>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>
  <dialog id="boarding" class="boarding" aria-label="Código de embarque"></dialog>
